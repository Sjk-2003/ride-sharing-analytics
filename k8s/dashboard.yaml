# SwiftRide Bengaluru live website. Reads Kafka inside the cluster (kafka:9092),
# so it does not need the external 30094 address or any tunnel.
# Open it at  http://<EC2_PUBLIC_IP>:30080  (EC2)  or  http://localhost:30080  (laptop).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swiftride-dashboard
  labels:
    app: swiftride-dashboard
spec:
  replicas: 1                    # totals live in memory: exactly one copy
  selector:
    matchLabels:
      app: swiftride-dashboard
  template:
    metadata:
      labels:
        app: swiftride-dashboard
    spec:
      enableServiceLinks: false
      containers:
        - name: dashboard
          image: swiftride-dashboard:v1
          imagePullPolicy: Never     # image is built locally, not downloaded
          ports:
            - containerPort: 8080
          env:
            - { name: KAFKA_BOOTSTRAP, value: "kafka:9092" }
            - { name: TOPIC, value: "ride-requests" }
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "192Mi"
          # /api/health always answers 200 while the web server is up (even if Kafka is down),
          # so Kubernetes only restarts the pod if the website itself hangs.
          readinessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: swiftride-dashboard
spec:
  type: NodePort
  selector:
    app: swiftride-dashboard
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
