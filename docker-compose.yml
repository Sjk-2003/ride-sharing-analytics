# Alternative to Kubernetes: runs the same Kafka + producer with plain Docker Compose.
# Run on EC2:  PUBLIC_IP=$(curl -s ifconfig.me) sudo -E docker compose up -d --build
# Databricks connects to <PUBLIC_IP>:30094, same as the Kubernetes version.
services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "30094:30094"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:30094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://${PUBLIC_IP}:30094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"
    restart: unless-stopped

  producer:
    build: ./producer
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP: "kafka:9092"
      TOPIC: "ride-requests"
      RIDES_PER_SECOND: "2"
    restart: unless-stopped
